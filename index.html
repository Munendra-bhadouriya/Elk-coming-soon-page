<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Something amazing is coming soon. Stay tuned!">
    <title>Coming Soon - Something Amazing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a1a2e;
            --accent-color: #ca8a04;
            --text-light: #f5f5f5;
            --text-dark: #333;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-color);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Animated Background */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--gradient-1);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--gradient-2);
            bottom: -150px;
            right: -150px;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: var(--gradient-3);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-50px, 50px) scale(0.9);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .content-block {
            flex: 1;
            min-width: 280px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: -2rem;
        }

        .form-block {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Logo/Brand */
        .logo {
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease-out;
        }

        .logo img {
            max-width: min(320px, 100%);
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Main Heading */
        .main-heading {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .main-heading .highlight {
            background: linear-gradient(135deg, #ca8a04 0%, #e0a020 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Subheading */
        .subheading {
            font-size: clamp(1rem, 2.5vw, 1.35rem);
            font-weight: 300;
            margin-bottom: 0;
            opacity: 0.9;
            max-width: 520px;
            line-height: 1.6;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        /* Enquiry Form */
        .enquiry-form {
            width: 100%;
            min-width: 320px;
            max-width: 380px;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-align: left;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .enquiry-form h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-light);
        }

        .enquiry-form label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(245, 245, 245, 0.9);
            margin-bottom: 0.35rem;
        }

        .enquiry-form input,
        .enquiry-form textarea {
            width: 100%;
            padding: 0.6rem 0.75rem;
            margin-bottom: 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-light);
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .enquiry-form input::placeholder,
        .enquiry-form textarea::placeholder {
            color: rgba(245, 245, 245, 0.45);
        }

        .enquiry-form input:focus,
        .enquiry-form textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(202, 138, 4, 0.25);
        }

        .enquiry-form textarea {
            min-height: 72px;
            resize: vertical;
        }

        .enquiry-form button {
            width: 100%;
            padding: 0.7rem 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary-color);
            background: linear-gradient(135deg, #ca8a04 0%, #e0a020 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: opacity 0.2s, transform 0.1s, color 0.2s;
        }

        .enquiry-form button:hover {
            opacity: 0.95;
        }

        .enquiry-form button:active {
            transform: scale(0.98);
        }

        .enquiry-form.is-submitting button {
            color: transparent;
            cursor: default;
            pointer-events: none;
        }

        .enquiry-form.is-submitting button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border-radius: 50%;
            border: 2px solid rgba(26, 26, 46, 0.25);
            border-top-color: var(--primary-color);
            animation: spin 0.65s linear infinite;
        }

        .enquiry-form .form-message {
            font-size: 0.9rem;
            margin-top: 0.75rem;
            padding: 0.5rem 0;
            border-radius: 6px;
            display: none;
        }

        .enquiry-form .form-message.success {
            display: block;
            color: #86efac;
        }

        .enquiry-form .form-message.error {
            display: block;
            color: #fca5a5;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                text-align: center;
            }

            .content-block {
                text-align: center;
            }

            .logo img {
                margin-left: auto;
                margin-right: auto;
            }
        }

        @media (max-width: 768px) {
            .logo img {
                max-width: min(260px, 80vw);
            }

            .enquiry-form {
                min-width: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
                gap: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="container">
        <div class="content-block">
            <div class="logo">
                <img src="Logo White (2).svg" alt="ELK AUDIOS - A unit of Globe Audio">
            </div>
            <h1 class="main-heading">
                Something <span class="highlight">Amazing</span><br>
                is Coming Soon
            </h1>
            <p class="subheading">
                We're crafting our website. Be the first to know when we launch.
            </p>
        </div>
        <div class="form-block">
            <form class="enquiry-form" id="enquiryForm" action="#" method="post">
            <h3>Enquiry</h3>
            <label for="enq-name">Name</label>
            <input type="text" id="enq-name" name="name" placeholder="Your name" required>
            <label for="enq-number">Number</label>
            <input type="tel" id="enq-number" name="number" placeholder="Phone number" required>
            <label for="enq-address">Address</label>
            <textarea id="enq-address" name="address" placeholder="Your address" required></textarea>
            <button type="submit">Submit</button>
            <p class="form-message" id="formMessage" aria-live="polite"></p>
            </form>
        </div>
    </div>

    <script>
        document.documentElement.style.scrollBehavior = 'smooth';

        document.getElementById('enquiryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var form = this;
            var msg = document.getElementById('formMessage');
            var btn = form.querySelector('button[type="submit"]');
            msg.classList.remove('success', 'error');
            msg.textContent = '';
            btn.disabled = true;
            form.classList.add('is-submitting');

            var formData = new URLSearchParams(new FormData(form)).toString();

            fetch('/api/enquiry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            }).then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); }).then(function(result) {
                if (result.ok && result.data.success) {
                    msg.textContent = result.data.message || 'Thank you! We\'ll get back to you soon.';
                    msg.classList.add('success');
                    form.reset();
                } else {
                    msg.textContent = (result.data && result.data.error) || 'Something went wrong. Please try again.';
                    msg.classList.add('error');
                }
            }).catch(function() {
                msg.textContent = 'Network error. Run the server and set GOOGLE_SCRIPT_URL, or check the console.';
                msg.classList.add('error');
            }).finally(function() {
                btn.disabled = false;
                form.classList.remove('is-submitting');
            });
        });
    </script>
</body>
</html>
