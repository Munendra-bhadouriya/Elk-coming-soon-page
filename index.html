<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Something amazing is coming soon. Stay tuned!">
    <title>Coming Soon - Something Amazing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a1a2e;
            --accent-color: #ca8a04;
            --text-light: #f5f5f5;
            --text-dark: #333;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-color);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Animated Background */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--gradient-1);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--gradient-2);
            bottom: -150px;
            right: -150px;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: var(--gradient-3);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: float-center 20s infinite ease-in-out;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-50px, 50px) scale(0.9);
            }
        }

        @keyframes float-center {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            33% {
                transform: translate(calc(-50% + 50px), calc(-50% - 50px)) scale(1.1);
            }
            66% {
                transform: translate(calc(-50% - 50px), calc(-50% + 50px)) scale(0.9);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .content-block {
            flex: 1;
            min-width: 280px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: -2rem;
        }

        .form-block {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Logo/Brand */
        .logo {
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease-out;
        }

        .logo-shimmer {
            position: relative;
            display: inline-block;
            max-width: min(320px, 100%);
            width: 100%;
            aspect-ratio: 4 / 3;
        }

        .logo-shimmer::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                #8b7500,
                #ffd700,
                #fffacd,
                #ffd700,
                #8b7500
            );
            background-size: 300% 300%;
            animation: shine 8s infinite linear;
            -webkit-mask-image: url("Logo White (2).svg");
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            -webkit-mask-size: contain;
            mask-image: url("Logo White (2).svg");
            mask-repeat: no-repeat;
            mask-position: center;
            mask-size: contain;
        }

        .logo-red-o {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Main Heading */
        .main-heading {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .gold-text {
            font-size: 1em;
            font-weight: 700;
            background: linear-gradient(
                90deg,
                #8b7500,
                #ffd700,
                #fffacd,
                #ffd700,
                #8b7500
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 8s infinite linear;
        }

        /* Subheading */
        .subheading {
            font-size: clamp(1rem, 2.5vw, 1.35rem);
            font-weight: 300;
            margin-bottom: 0;
            opacity: 0.9;
            max-width: 520px;
            line-height: 1.6;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        /* Enquiry Form */
        .enquiry-form {
            width: 100%;
            min-width: 320px;
            max-width: 380px;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-align: left;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .enquiry-form h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-light);
        }

        .enquiry-form label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(245, 245, 245, 0.9);
            margin-bottom: 0.35rem;
        }

        .enquiry-form input,
        .enquiry-form textarea {
            width: 100%;
            padding: 0.6rem 0.75rem;
            margin-bottom: 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-light);
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .enquiry-form input::placeholder,
        .enquiry-form textarea::placeholder {
            color: rgba(245, 245, 245, 0.45);
        }

        .enquiry-form input:focus,
        .enquiry-form textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(202, 138, 4, 0.25);
        }

        .enquiry-form textarea {
            min-height: 72px;
            resize: vertical;
        }

        .enquiry-form button {
            width: 100%;
            padding: 0.7rem 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary-color);
            background: linear-gradient(
                90deg,
                #8b7500,
                #ffd700,
                #fffacd,
                #ffd700,
                #8b7500
            );
            background-size: 300% 300%;
            animation: shine 8s infinite linear;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: opacity 0.2s, transform 0.1s, color 0.2s;
        }

        .enquiry-form button:hover {
            opacity: 0.95;
        }

        .enquiry-form button:active {
            transform: scale(0.98);
        }

        .enquiry-form.is-submitting button {
            color: transparent;
            cursor: default;
            pointer-events: none;
        }

        .enquiry-form.is-submitting button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border-radius: 50%;
            border: 2px solid rgba(26, 26, 46, 0.25);
            border-top-color: var(--primary-color);
            animation: spin 0.65s linear infinite;
        }

        .enquiry-form .form-message {
            font-size: 0.9rem;
            margin-top: 0.75rem;
            padding: 0.5rem 0;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .enquiry-form .form-message.success {
            display: block;
            color: #86efac;
            animation: fadeIn 0.35s ease-out;
        }

        .enquiry-form .form-message.error {
            display: block;
            color: #fca5a5;
            animation: fadeIn 0.35s ease-out;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                text-align: center;
            }

            .content-block {
                text-align: center;
            }

            .logo,
            .logo-shimmer {
                margin-top: 1.5rem;
                margin-left: auto;
                margin-right: auto;
            }
        }

        @media (max-width: 768px) {
            .logo img {
                max-width: min(260px, 80vw);
            }

            .enquiry-form {
                min-width: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
                gap: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="container">
        <div class="content-block">
            <div class="logo logo-shimmer" role="img" aria-label="ELK AUDIOS - A unit of Globe Audio">
                <svg class="logo-red-o" viewBox="0 0 1967 1469" aria-hidden="true" focusable="false">
                    <path d="M1496 1131C1498.92 1133.12 1501.47 1135.43 1504 1138C1504.55 1138.52 1505.09 1139.05 1505.65 1139.59C1514.25 1148.56 1515.74 1159.58 1515.71 1171.52C1515.72 1172.87 1515.74 1174.22 1515.75 1175.57C1515.79 1179.08 1515.8 1182.59 1515.81 1186.1C1515.82 1189.7 1515.85 1193.3 1515.89 1196.9C1515.95 1203.93 1515.99 1210.97 1516 1218C1517.09 1218.53 1518.17 1219.06 1519.29 1219.61C1520.74 1220.33 1522.19 1221.04 1523.63 1221.76C1524.7 1222.28 1524.7 1222.28 1525.8 1222.82C1546.67 1233.16 1561.52 1251.39 1569.14 1273.26C1576.04 1297.93 1573.06 1322.49 1560.66 1344.59C1557.33 1350.26 1553.5 1355.2 1549 1360C1548.42 1360.65 1547.83 1361.3 1547.23 1361.97C1533.39 1376.72 1511.2 1386.41 1491.03 1387.34C1465.53 1387.79 1443.33 1380.07 1424.37 1362.48C1409.69 1348.19 1399.24 1327.15 1398.83 1306.52C1398.82 1304.43 1398.81 1302.34 1398.81 1300.25C1398.8 1299.22 1398.79 1298.18 1398.78 1297.12C1398.76 1290.5 1399.42 1284.42 1401 1278C1401.2 1277.17 1401.4 1276.35 1401.61 1275.5C1407.06 1254.23 1422.08 1236.17 1440.61 1224.97C1457.73 1215 1457.73 1215 1467 1215C1466.94 1207.59 1466.86 1200.19 1466.76 1192.78C1466.72 1189.34 1466.68 1185.9 1466.65 1182.46C1466.62 1178.49 1466.57 1174.53 1466.51 1170.57C1466.51 1169.34 1466.5 1168.12 1466.49 1166.86C1466.34 1158 1465.19 1150.5 1460 1143.12C1459.51 1142.41 1459.01 1141.69 1458.5 1140.95C1457.11 1139.14 1455.65 1137.57 1454 1136C1455 1133 1455 1133 1457.14 1131.65C1458.03 1131.23 1458.91 1130.81 1459.81 1130.37C1460.69 1129.95 1461.56 1129.52 1462.46 1129.09C1472.38 1124.85 1486.78 1125.27 1496 1131Z" fill="#EE4127"/>
                </svg>
            </div>
            <h1 class="main-heading">
                Something <span class="gold-text">Amazing</span><br>
                Coming Soon
            </h1>
            <p class="subheading">
                We're crafting our website. Be the first to know when we launch.
            </p>
        </div>
        <div class="form-block">
            <form class="enquiry-form" id="enquiryForm" action="#" method="post">
            <h3>Enquiry</h3>
            <label for="enq-name">Name</label>
            <input type="text" id="enq-name" name="name" placeholder="Your name" required>
            <label for="enq-number">Number</label>
            <input type="tel" id="enq-number" name="number" placeholder="Phone number" required>
            <label for="enq-address">Address</label>
            <textarea id="enq-address" name="address" placeholder="Your address" required></textarea>
            <button type="submit">Submit</button>
            <p class="form-message" id="formMessage" aria-live="polite"></p>
            </form>
        </div>
    </div>

    <script>
        document.documentElement.style.scrollBehavior = 'smooth';

        document.getElementById('enquiryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var form = this;
            var msg = document.getElementById('formMessage');
            var btn = form.querySelector('button[type="submit"]');
            msg.classList.remove('success', 'error');
            msg.textContent = '';
            btn.disabled = true;
            form.classList.add('is-submitting');

            var formData = new URLSearchParams(new FormData(form)).toString();

            fetch('/api/enquiry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            }).then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); }).then(function(result) {
                if (result.ok && result.data.success) {
                    msg.textContent = result.data.message || 'Thank you! We\'ll get back to you soon.';
                    msg.classList.add('success');
                    form.reset();
                } else {
                    msg.textContent = (result.data && result.data.error) || 'Something went wrong. Please try again.';
                    msg.classList.add('error');
                }
            }).catch(function() {
                msg.textContent = 'Network error. Run the server and set GOOGLE_SCRIPT_URL, or check the console.';
                msg.classList.add('error');
            }).finally(function() {
                btn.disabled = false;
                form.classList.remove('is-submitting');
            });
        });
    </script>
</body>
</html>
